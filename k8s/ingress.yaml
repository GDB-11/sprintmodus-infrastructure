# The public edge, on k3s's bundled Traefik (v3 CRDs). TLS comes from Traefik's own Let's Encrypt resolver `le`
# (traefik-config.yaml), so there is no cert-manager (three more pods) on a 4 GB node. Same behaviour as the Caddyfile:
# http -> https, www -> the bare domain, HSTS for one year on this exact host only.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  labels: { phase: 5-edge }
spec:
  redirectScheme: { scheme: https, permanent: true }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-apex
  labels: { phase: 5-edge }
spec:
  redirectRegex:
    regex: "^https://www\\.__DOMAIN__/(.*)"
    replacement: "https://__DOMAIN__/${1}"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hsts
  labels: { phase: 5-edge }
spec:
  headers: { stsSeconds: 31536000 }
---
# Plain HTTP: everything goes to https (Traefik answers the Let's Encrypt challenge itself, before this router)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: http-to-https
  labels: { phase: 5-edge }
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: sprintmodus-redirect-https@kubernetescrd
spec:
  rules:
    - host: __DOMAIN__
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: frontend, port: { number: 8080 } } } }] }
    - host: www.__DOMAIN__
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: frontend, port: { number: 8080 } } } }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  labels: { phase: 5-edge }
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: le
    traefik.ingress.kubernetes.io/router.middlewares: sprintmodus-hsts@kubernetescrd
spec:
  rules:
    - host: __DOMAIN__
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: frontend, port: { number: 8080 } } } }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: www-to-apex
  labels: { phase: 5-edge }
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: le
    traefik.ingress.kubernetes.io/router.middlewares: sprintmodus-redirect-apex@kubernetescrd
spec:
  rules:
    - host: www.__DOMAIN__
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: frontend, port: { number: 8080 } } } }] }
