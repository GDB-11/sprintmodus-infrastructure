apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  labels: { app: eureka-server, phase: 3-eureka }
spec:
  selector: { app: eureka-server }
  ports:
    - { name: http, port: 8761 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  labels: { app: eureka-server, phase: 3-eureka }
spec:
  replicas: 1
  strategy:
    # One instance, and little RAM: stop the old pod before starting the new one rather than running two JVMs side by side
    type: Recreate
  selector:
    matchLabels: { app: eureka-server }
  template:
    metadata:
      labels: { app: eureka-server }
    spec:
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: eureka-server
          image: ghcr.io/gdb-11/sprintmodus-eureka-server
          command: ["java", "-XX:MaxRAMPercentage=55", "-XX:+UseSerialGC", "-XX:TieredStopAtLevel=1", "-Xss512k", "-XX:+ExitOnOutOfMemoryError", "-jar", "app.jar"]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          ports:
            - { name: http, containerPort: 8761 }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 80
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 320Mi }
