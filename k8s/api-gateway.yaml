apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels: { app: api-gateway, phase: 4-services }
spec:
  selector: { app: api-gateway }
  ports:
    - { name: http, port: 8090 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels: { app: api-gateway, phase: 4-services }
spec:
  replicas: 1
  strategy:
    # One instance, and little RAM: stop the old pod before starting the new one rather than running two JVMs side by side
    type: Recreate
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: api-gateway
          image: ghcr.io/gdb-11/sprintmodus-api-gateway
          command: ["java", "-XX:MaxRAMPercentage=55", "-XX:+UseSerialGC", "-XX:TieredStopAtLevel=1", "-Xss512k", "-XX:+ExitOnOutOfMemoryError", "-jar", "app.jar"]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          ports:
            - { name: http, containerPort: 8090 }
          env:
            - { name: EUREKA_URL, value: "http://eureka-server:8761/eureka" }
            - { name: EUREKA_INSTANCE_PREFER_IP_ADDRESS, value: "true" }
            - { name: CORS_ALLOWED_ORIGINS, valueFrom: { configMapKeyRef: { name: sprintmodus-config, key: PUBLIC_ORIGIN } } }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 80
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 384Mi }
