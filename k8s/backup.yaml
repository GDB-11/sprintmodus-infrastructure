# Daily logical backup of master_db + every tenant_* (scripts/backup.sh, mounted from a ConfigMap that deploy.sh creates).
# Same disk as the data: it protects against mistakes, NOT against losing the server. Copy it off (README, "Data safety").
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-backups
  labels: { phase: 1-db }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: { storage: 5Gi }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  labels: { phase: 1-db }
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          enableServiceLinks: false
          restartPolicy: Never
          containers:
            - name: backup
              image: mysql:9.7
              command: ["/scripts/backup.sh", "once"]
              env:
                - { name: MYSQL_HOST, value: master-db }
                - { name: BACKUP_KEEP_DAYS, value: "7" }
                - name: MYSQL_ROOT_PASSWORD
                  valueFrom: { secretKeyRef: { name: sprintmodus-secrets, key: MASTER_DB_ROOT_PASSWORD } }
              volumeMounts:
                - { name: script, mountPath: /scripts, readOnly: true }
                - { name: backups, mountPath: /backups }
              resources:
                requests: { cpu: 10m, memory: 64Mi }
                limits: { memory: 256Mi }
          volumes:
            - name: script
              configMap: { name: db-backup-script, defaultMode: 0555 }
            - name: backups
              persistentVolumeClaim: { claimName: db-backups }
